<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanenCerdas — Informasi lebih dekat, keputusan lebih kuat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pc: {
                            50: '#F4F7F2',
                            100: '#E6EFE1',
                            200: '#CCDCC3',
                            500: '#2D6A4F', // Deep agronomy green accent
                            600: '#1B4332',
                            700: '#143828',
                            amber: '#D97706',
                            earth: '#85581A',
                            sand: '#FBFBFA',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121816;
            color: #1F2937;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slideUp {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(45, 106, 79, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(45, 106, 79, 0); }
        }
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="bg-[#0D1512] min-h-screen flex items-center justify-center p-0 sm:py-6 sm:px-4">

    <!-- Mobile Device Simulator Container -->
    <div id="app-container" class="w-full sm:max-w-[430px] h-screen sm:h-[880px] bg-[#FBFBFA] sm:rounded-[44px] shadow-2xl flex flex-col relative overflow-hidden border-0 sm:border-[8px] sm:border-[#202E29]">

        <!-- Top Status Bar (Simulated Mobile) -->
        <div class="bg-[#143828] text-white px-6 py-2.5 flex justify-between items-center text-xs select-none z-50 shrink-0">
            <span class="font-semibold tracking-wide flex items-center"><i class="fa-solid fa-seedling text-emerald-400 mr-1.5"></i> PanenCerdas</span>
            <div class="flex items-center space-x-2">
                <span id="network-status" class="flex items-center text-[10px] bg-emerald-700/60 px-2 py-0.5 rounded-full"><i class="fa-solid fa-signal mr-1"></i> Stabil</span>
                <span id="clock-time" class="font-mono font-bold">09:23</span>
            </div>
        </div>

        <!-- Main Dynamic Viewport -->
        <div id="main-viewport" class="flex-1 overflow-y-auto pb-24 relative bg-[#FBFBFA] no-scrollbar">
            <!-- Dynamically rendered via JS -->
        </div>

        <!-- Global Bottom Navigation Bar (MVP: Beranda, Pasar, Cek Lahan, Profil) -->
        <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-emerald-900/10 px-2 py-2.5 flex justify-around items-center z-40 shadow-xl">
            <button onclick="switchTab('beranda')" id="nav-beranda" class="flex flex-col items-center text-pc-500 transition-all duration-200">
                <i class="fa-solid fa-house text-base mb-0.5"></i>
                <span class="text-[9px] font-semibold">Beranda</span>
            </button>
            <button onclick="switchTab('pasar')" id="nav-pasar" class="flex flex-col items-center text-gray-400 hover:text-pc-500 transition-all duration-200">
                <i class="fa-solid fa-chart-line text-base mb-0.5"></i>
                <span class="text-[9px] font-semibold">Pasar</span>
            </button>
            <button onclick="switchTab('ceklahan')" id="nav-ceklahan" class="flex flex-col items-center text-gray-400 hover:text-pc-500 transition-all duration-200">
                <i class="fa-solid fa-cloud-sun-rain text-base mb-0.5"></i>
                <span class="text-[9px] font-semibold">Cek Lahan</span>
            </button>
            <button onclick="switchTab('profil')" id="nav-profil" class="flex flex-col items-center text-gray-400 hover:text-pc-500 transition-all duration-200">
                <i class="fa-solid fa-user text-base mb-0.5"></i>
                <span class="text-[9px] font-semibold">Profil</span>
            </button>
        </nav>

        <!-- Floating AI Quick Assistant Button -->
        <div id="floating-ai-btn" class="absolute bottom-20 right-5 z-30">
            <button onclick="openTanyaPanen()" class="bg-[#2D6A4F] text-white p-4 rounded-full shadow-2xl flex items-center justify-center hover:bg-[#1B4332] transition-transform active:scale-95 group border-2 border-emerald-300 pulse-glow">
                <i class="fa-solid fa-robot text-xl group-hover:rotate-12 transition-transform"></i>
            </button>
        </div>

        <!-- Notification Banner Toast Container -->
        <div id="toast-container" class="absolute top-12 left-4 right-4 z-50 pointer-events-none flex flex-col space-y-2"></div>

        <!-- Modal Container -->
        <div id="modal-container" class="absolute inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-opacity"></div>

    </div>

    <script>
        const state = {
            currentTab: 'beranda',
            onboardingStep: 1, 
            user: {
                name: 'Pak Budi Santoso',
                phone: '081234567890',
                kabupaten: 'Banyuwangi',
                kecamatan: 'Genteng',
                kelompokTani: 'Kelompok Tani Subur Makmur',
                commodities: ['Padi'],
                commPref: 'Keduanya (WhatsApp & SMS)',
                gps: '-8.3512, 114.1523',
                notifications: {
                    waHarga: true,
                    waCuaca: true,
                    smsHarga: true,
                    smsDarurat: true
                },
                activeSchedules: [
                    { id: 1, name: 'Padi GKP - Blok Utara', datePlanted: '2026-03-01', estHarvest: '2026-06-15', area: '1.5 Hektar', status: 'Masa Pertumbuhan (Vegetatif)', daysLeft: 48 }
                ]
            },
            marketTrends: [
                { name: 'Tomat Merah', category: 'Sayuran', price: 'Rp4.500/kg', trend: 'Anjlok 📉', note: 'Pasokan melimpah dari dataran tinggi Malang & Semeru', source: 'Dinas Pertanian Jatim & Pengepul Lokal' },
                { name: 'Apel Washington / Lokal', category: 'Buah', price: 'Rp35.000/kg', trend: 'Tinggi 🚀', note: 'Permintaan menjelang musiman meningkat tinggi', source: 'Asosiasi Hortikultura Malang' },
                { name: 'Padi (GKP) - Genteng', category: 'Pangan', price: 'Rp6.420/kg', trend: 'Stabil Naik 📈', note: 'Harga mikro akurat wilayah Genteng, Banyuwangi', source: 'Bulog & BPS Regional Banyuwangi' },
                { name: 'Cabai Rawit Merah', category: 'Sayuran', price: 'Rp48.000/kg', trend: 'Lonjakan Tinggi 🔥', note: 'Curah hujan tinggi mempengaruhi hasil panen', source: 'Pasar Induk Genteng & Rogojampi' },
                { name: 'Bawang Merah', category: 'Sayuran', price: 'Rp25.000/kg', trend: 'Stabil ➡️', note: 'Pasokan dari Nganjuk dan Probolinggo stabil', source: 'Pedagang Pasar Tradisional' }
            ],
            marketFilter: 'Semua',
            marketSearch: '',
            middlemen: [
                { name: 'H. Suwarto (Grosir Padi Jatim)', comm: 'Padi / Gabah', need: 'Butuh 15 Ton minggu ini', priceOffer: 'Rp6.450/kg', distance: '4.2 km dari Genteng', phone: '628123456781', verified: true },
                { name: 'CV. Bumi Tani Sejahtera', comm: 'Cabai & Sayur', need: 'Butuh 2 Ton Cabai Merah', priceOffer: 'Rp30.500/kg', distance: '7.5 km dari Genteng', phone: '628123456782', verified: true }
            ],
            chatMessages: [
                { sender: 'ai', text: 'Halo Pak Budi 👋 Saya AI Pendamping PanenCerdas. Ada yang ingin didiskusikan mengenai harga mikro kecamatan Genteng, prediksi cuaca lahan, atau siklus tanam?' }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            setInterval(updateClock, 1000);
            updateClock();

            const onboardingDone = localStorage.getItem('pc_onboarding_done');
            if (onboardingDone === 'true') {
                state.onboardingStep = 6;
                renderApp();
            } else {
                renderOnboarding();
            }
        });

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const el = document.getElementById('clock-time');
            if (el) el.innerText = `${h}:${m}`;
        }

        function renderOnboarding() {
            const container = document.getElementById('main-viewport');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('floating-ai-btn').classList.add('hidden');

            let html = '';
            if (state.onboardingStep === 1) {
                html = `
                    <div class="flex-1 flex flex-col justify-between p-6 bg-[#FBFBFA] animate-fadeIn min-h-full">
                        <div class="space-y-6 pt-6">
                            <div class="w-20 h-20 rounded-3xl bg-emerald-100 text-[#2D6A4F] flex items-center justify-center text-4xl shadow-inner mx-auto">
                                <i class="fa-solid fa-wheat-awn"></i>
                            </div>
                            <div class="space-y-3 text-center">
                                <span class="bg-emerald-100 text-emerald-800 text-xs px-3.5 py-1.5 rounded-full font-bold">PanenCerdas (MVP)</span>
                                <h1 class="text-2xl font-bold text-gray-900 leading-tight">“Informasi lebih dekat, keputusan lebih kuat.”</h1>
                                <p class="text-xs text-gray-600 leading-relaxed max-w-xs mx-auto">Platform agritech AI dengan kalkulator harga GPS presisi, pelacakan siklus tanam otomatis, dan deteksi cuaca mikro lahan.</p>
                            </div>
                        </div>
                        <div class="space-y-3 pb-6">
                            <button onclick="nextOnboarding()" class="w-full bg-[#2D6A4F] hover:bg-[#1B4332] text-white font-semibold py-4 rounded-2xl shadow-lg transition-all text-sm">Mulai Pendaftaran Wajib</button>
                        </div>
                    </div>
                `;
            } else if (state.onboardingStep === 2) {
                html = `
                    <div class="flex-1 flex flex-col justify-between p-6 bg-[#FBFBFA] animate-fadeIn min-h-full">
                        <div class="space-y-5 pt-4">
                            <div class="flex justify-between items-center text-xs font-semibold text-emerald-800">
                                <span class="bg-emerald-100 px-3 py-1 rounded-full font-bold">Langkah 2 dari 4</span>
                                <span>Data Wajib Petani</span>
                            </div>
                            <h2 class="text-xl font-bold text-gray-900">Kenalan dulu 😊<br>Siapa nama & nomor WhatsApp Bapak/Ibu?</h2>
                            <div class="space-y-4">
                                <div>
                                    <label class="text-xs font-semibold text-gray-500 uppercase block mb-1">Nama Lengkap / Sapaan</label>
                                    <input type="text" id="ob-name" value="${state.user.name}" class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#2D6A4F] focus:outline-none shadow-sm">
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-gray-500 uppercase block mb-1">Nomor WhatsApp / HP</label>
                                    <input type="text" id="ob-phone" value="${state.user.phone}" class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#2D6A4F] focus:outline-none shadow-sm">
                                </div>
                            </div>
                        </div>
                        <div class="pb-6">
                            <button onclick="saveOnboardingStep2()" class="w-full bg-[#2D6A4F] hover:bg-[#1B4332] text-white font-semibold py-4 rounded-2xl shadow-lg text-sm">Lanjut</button>
                        </div>
                    </div>
                `;
            } else if (state.onboardingStep === 3) {
                html = `
                    <div class="flex-1 flex flex-col justify-between p-6 bg-[#FBFBFA] animate-fadeIn min-h-full">
                        <div class="space-y-5 pt-4">
                            <div class="flex justify-between items-center text-xs font-semibold text-emerald-800">
                                <span class="bg-emerald-100 px-3 py-1 rounded-full font-bold">Langkah 3 dari 4</span>
                                <span>Wilayah Mikro</span>
                            </div>
                            <h2 class="text-xl font-bold text-gray-900">Lokasi hamparan & kelompok tani Bapak/Ibu?</h2>
                            <div class="space-y-4">
                                <div>
                                    <label class="text-xs font-semibold text-gray-500 uppercase block mb-1">Kabupaten</label>
                                    <select id="ob-kab" class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-2xl text-sm focus:ring-2 focus:ring-[#2D6A4F] focus:outline-none shadow-sm">
                                        <option value="Banyuwangi" selected>Banyuwangi</option>
                                        <option value="Jember">Jember</option>
                                        <option value="Lumajang">Lumajang</option>
                                        <option value="Malang">Malang</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-gray-500 uppercase block mb-1">Kecamatan (Harga Mikro Presisi)</label>
                                    <input type="text" id="ob-kec" value="${state.user.kecamatan}" class="w-full px-4 py-3.5 bg-white border border-gray-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-[#2D6A4F] focus:outline-none shadow-sm">
                                </div>
                            </div>
                        </div>
                        <div class="pb-6">
                            <button onclick="saveOnboardingStep3()" class="w-full bg-[#2D6A4F] hover:bg-[#1B4332] text-white font-semibold py-4 rounded-2xl shadow-lg text-sm">Lanjut</button>
                        </div>
                    </div>
                `;
            } else if (state.onboardingStep === 4) {
                html = `
                    <div class="flex-1 flex flex-col justify-between p-6 bg-[#FBFBFA] animate-fadeIn min-h-full">
                        <div class="space-y-5 pt-4">
                            <div class="flex justify-between items-center text-xs font-semibold text-emerald-800">
                                <span class="bg-emerald-100 px-3 py-1 rounded-full font-bold">Langkah 4 dari 4</span>
                                <span>Komoditas Utama</span>
                            </div>
                            <h2 class="text-xl font-bold text-gray-900">Komoditas apa yang paling sering Bapak/Ibu tanam?</h2>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="toggleObComm('Padi')" id="comm-padi" class="p-4 rounded-2xl border-2 border-[#2D6A4F] bg-emerald-50 text-left space-y-1 shadow-sm">
                                    <span class="text-2xl">🌾</span>
                                    <div class="font-bold text-sm text-gray-900">Padi (Pangan)</div>
                                </button>
                                <button onclick="toggleObComm('Cabai')" id="comm-cabai" class="p-4 rounded-2xl border-2 border-gray-200 bg-white text-left space-y-1 shadow-sm">
                                    <span class="text-2xl">🌶️</span>
                                    <div class="font-bold text-sm text-gray-900">Cabai & Sayur</div>
                                </button>
                            </div>
                        </div>
                        <div class="pb-6">
                            <button onclick="finishOnboarding()" class="w-full bg-[#2D6A4F] hover:bg-[#1B4332] text-white font-semibold py-4 rounded-2xl shadow-lg text-sm">Selesai & Masuk Beranda</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function nextOnboarding() {
            state.onboardingStep++;
            renderOnboarding();
        }

        function saveOnboardingStep2() {
            const name = document.getElementById('ob-name').value;
            const phone = document.getElementById('ob-phone').value;
            if (name) state.user.name = name;
            if (phone) state.user.phone = phone;
            nextOnboarding();
        }

        function saveOnboardingStep3() {
            const kab = document.getElementById('ob-kab').value;
            const kec = document.getElementById('ob-kec').value;
            if (kab) state.user.kabupaten = kab;
            if (kec) state.user.kecamatan = kec;
            nextOnboarding();
        }

        function toggleObComm(c) {
            if (!state.user.commodities.includes(c)) state.user.commodities.push(c);
            else state.user.commodities = state.user.commodities.filter(x => x !== c);
            showToast(`Komoditas ${c} diperbarui`);
        }

        function finishOnboarding() {
            localStorage.setItem('pc_onboarding_done', 'true');
            state.onboardingStep = 6;
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('floating-ai-btn').classList.remove('hidden');
            switchTab('beranda');
            showToast(`Selamat datang di PanenCerdas, ${state.user.name}! 🌱`);
        }

        function renderApp() {
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('floating-ai-btn').classList.remove('hidden');
            switchTab(state.currentTab);
        }

        function switchTab(tabId) {
            state.currentTab = tabId;
            ['beranda', 'pasar', 'ceklahan', 'profil'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tabId) btn.className = "flex flex-col items-center text-pc-500 font-bold scale-105 transition-all";
                    else btn.className = "flex flex-col items-center text-gray-400 hover:text-pc-500 transition-all";
                }
            });
            const viewport = document.getElementById('main-viewport');
            viewport.scrollTop = 0;

            if (tabId === 'beranda') renderBeranda();
            else if (tabId === 'pasar') renderPasar();
            else if (tabId === 'ceklahan') renderCekLahan();
            else if (tabId === 'profil') renderProfil();
        }

        function renderBeranda() {
            const viewport = document.getElementById('main-viewport');
            viewport.innerHTML = `
                <!-- Top Header -->
                <div class="px-6 pt-5 pb-3 flex justify-between items-center bg-white border-b border-gray-100">
                    <div>
                        <div class="text-xs text-gray-500">Kec. ${state.user.kecamatan}, Kab. ${state.user.kabupaten}</div>
                        <h1 class="text-lg font-bold text-gray-900">${state.user.name}</h1>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="openGpsPriceCalculatorModal()" class="bg-[#2D6A4F] text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-sm flex items-center space-x-1.5 hover:bg-[#1B4332]">
                            <i class="fa-solid fa-calculator text-[10px]"></i>
                            <span>Cek Harga & Kalkulator</span>
                        </button>
                        <button onclick="switchTab('profil')" class="w-9 h-9 rounded-full bg-emerald-100 text-[#2D6A4F] font-bold flex items-center justify-center text-sm shadow-sm">
                            ${state.user.name.charAt(0)}
                        </button>
                    </div>
                </div>

                <div class="p-5 space-y-5 animate-fadeIn">
                    <!-- Workflow Masa Tanam & Countdown Hitung Panen (Widget Atas) -->
                    <div class="bg-gradient-to-br from-[#143828] to-[#1B4332] text-white p-5 rounded-3xl shadow-lg space-y-3 relative overflow-hidden">
                        <div class="absolute -right-4 -bottom-4 text-white/10 text-8xl font-black pointer-events-none">🌾</div>
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-2 text-emerald-300 text-xs font-semibold">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                                <span>Output Countdown Masa Tanam & Prediksi Panen</span>
                            </div>
                            <button onclick="openAddScheduleModal()" class="bg-white/20 hover:bg-white/30 text-white text-[10px] px-2.5 py-1 rounded-full font-bold">+ Tambah Tanam</button>
                        </div>

                        ${state.user.activeSchedules.map(sch => `
                            <div class="bg-white/10 backdrop-blur-sm p-4 rounded-2xl space-y-2">
                                <div class="flex justify-between items-center">
                                    <div class="font-bold text-sm text-white">${sch.name}</div>
                                    <span class="text-[10px] bg-emerald-500 text-white px-2.5 py-0.5 rounded-full font-bold">${sch.status}</span>
                                </div>
                                <div class="grid grid-cols-3 gap-2 text-center py-1">
                                    <div class="bg-black/20 p-2 rounded-xl">
                                        <div class="text-lg font-black text-emerald-300">${sch.daysLeft}</div>
                                        <div class="text-[9px] text-gray-300">Hari Menuju Panen</div>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded-xl">
                                        <div class="text-xs font-bold text-white mt-1">${sch.area}</div>
                                        <div class="text-[9px] text-gray-300">Luas Hamparan</div>
                                    </div>
                                    <div class="bg-black/20 p-2 rounded-xl">
                                        <div class="text-xs font-bold text-amber-300 mt-1">${sch.estHarvest}</div>
                                        <div class="text-[9px] text-gray-300">Estimasi Tanggal</div>
                                    </div>
                                </div>
                                <div class="text-[11px] text-emerald-200 pt-1 flex items-center justify-between">
                                    <span>⚠️ Rekomendasi: Mulai pantau harga pasar & kondisi cuaca lahan.</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Pindahan Card #KomunitasSiapEkspor dari Halaman Kolaborasi -->
                    <div class="bg-gradient-to-br from-amber-700 via-amber-800 to-[#1B4332] text-white p-5 rounded-3xl shadow-xl space-y-3 relative overflow-hidden border border-amber-500/30">
                        <div class="absolute -right-4 -bottom-4 text-white/5 text-9xl font-black pointer-events-none">🌐</div>
                        <div class="flex justify-between items-center">
                            <span class="bg-amber-500 text-white text-[10px] px-3 py-1 rounded-full font-black tracking-wide uppercase shadow"><i class="fa-solid fa-crown mr-1"></i> PREMIUM ACCESS</span>
                            <span class="text-[10px] text-amber-200 font-mono">Jejaring Antar-Daerah</span>
                        </div>
                        <h3 class="text-lg font-bold">#KomunitasSiapEkspor</h3>
                        <p class="text-xs text-amber-100 leading-relaxed">Wadah khusus edukasi standar kualitas internasional, panduan pengemasan (packaging), dan akses langsung pembeli skala besar / ekspor.</p>
                        
                        <div class="pt-3 border-t border-white/15 flex items-center justify-between">
                            <div class="text-xs text-amber-200">
                                <strong>1.420 Anggota</strong> • Standar Global
                            </div>
                            <button onclick="openExportCommunityModal()" class="bg-white text-amber-900 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-amber-50">Gabung Komunitas</button>
                        </div>
                    </div>

                    <!-- Rekomendasi Pengepul / Pembeli Siap Beli -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Rekomendasi Pembeli Siap Beli</h4>

                                    <i class="fa-solid fa-cloud-sun-rain text-emerald-700 mr-1.5"></i> Aktifkan Prediksi Cuaca AI
                                </div>
                                <div class="text-[10px] text-emerald-800">Pantau cuaca hujan/kemarau selama siklus hidup</div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="toggle-cuaca" checked class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#2D6A4F]"></div>
                            </label>
                        </div>

                        <!-- REVISI: Deteksi Lokasi Otomatis via GPS -->
                        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200 text-[11px] text-gray-600 flex items-center space-x-2">
                            <i class="fa-solid fa-location-dot text-emerald-700"></i>
                            <span>Deteksi lokasi otomatis via GPS: <strong>${state.user.gps}</strong></span>
                        </div>
                    </div>

                    <button onclick="saveNewSchedule()" class="w-full bg-[#2D6A4F] text-white font-semibold py-3.5 rounded-2xl text-sm shadow">Hitung Countdown Otomatis</button>
                </div>
            `;
        }

        function saveNewSchedule() {
            const name = document.getElementById('sch-name').value;
            const datePlanted = document.getElementById('sch-date').value;
            const area = document.getElementById('sch-area').value;
            const isWeatherActive = document.getElementById('toggle-cuaca').checked;

            state.user.activeSchedules.unshift({
                id: Date.now(),
                name: name,
                datePlanted: datePlanted,
                estHarvest: '2026-06-15',
                area: area,
                status: 'Masa Pertumbuhan (Vegetatif)',
                daysLeft: 64
            });

            closeModal();
            showToast('Jadwal tanam & countdown panen berhasil disimpan!');
            
            if (isWeatherActive) {
                switchTab('ceklahan');
            } else {
                renderBeranda();
            }
        }

        function openTanyaPanen() {
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            renderChatUI();
        }

        function renderChatUI() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="bg-white w-full sm:max-w-md rounded-t-[32px] sm:rounded-3xl shadow-2xl flex flex-col h-[85vh] sm:h-[650px] overflow-hidden animate-slideUp">
                    <div class="bg-[#143828] text-white px-5 py-4 flex justify-between items-center shrink-0">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-emerald-600/60 flex items-center justify-center text-xl">🤖</div>
                            <div>
                                <h3 class="font-bold text-sm">AI Pendamping PanenCerdas</h3>
                                <p class="text-[10px] text-emerald-300">Wilayah ${state.user.kecamatan}, ${state.user.kabupaten}</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div id="chat-messages-scroll" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
                        ${state.chatMessages.map(msg => `
                            <div class="flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-[#2D6A4F] text-white rounded-tr-none shadow-sm' : 'bg-white text-gray-800 rounded-tl-none border border-gray-100 shadow-sm'}">
                                    ${msg.text}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="p-3 bg-white border-t border-gray-100 flex items-center space-x-2 shrink-0">
                        <input type="text" id="chat-input" placeholder="Ketik pertanyaan..." class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-xs focus:ring-2 focus:ring-[#2D6A4F] focus:outline-none">
                        <button onclick="sendChatMessage()" class="w-11 h-11 bg-[#2D6A4F] text-white rounded-2xl flex items-center justify-center shrink-0 hover:bg-[#1B4332]"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            `;
            const scroll = document.getElementById('chat-messages-scroll');
            if (scroll) scroll.scrollTop = scroll.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            state.chatMessages.push({ sender: 'user', text: txt });
            input.value = '';
            renderChatUI();

            setTimeout(() => {
                let reply = `Baik Pak Budi, saya telah mencatat pertanyaan Anda mengenai "${txt}". Untuk wilayah ${state.user.kecamatan}, pantau selalu harga mikro dan prediksi cuaca lahan di PanenCerdas.`;
                state.chatMessages.push({ sender: 'ai', text: reply });
                renderChatUI();
            }, 800);
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-[#143828] text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center space-x-2 animate-fadeIn pointer-events-auto";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
